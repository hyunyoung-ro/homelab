name: build
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: site
          file: site/Containerfile
          platforms: linux/amd64,linux/arm64
          build-args: GIT_SHA=${{ github.sha }}
          push: true
          tags: ghcr.io/hyunyoung-ro/site:sha-${{ github.sha }}