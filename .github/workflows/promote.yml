name: promote
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "승격할 커밋 SHA (40자)"
        required: true
permissions:
  packages: write
jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid sha"; exit 1; }
          docker buildx imagetools create \
            -t ghcr.io/hyunyoung-ro/site:prod \
            "ghcr.io/hyunyoung-ro/site:sha-$SHA"